<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>局域快传</title>
    <style>
      :root {
        --bg: #f3f0eb;
        --surface: #fff;
        --border: #e5ddd4;
        --text: #2a2520;
        --text-2: #8a7e72;
        --accent: #c8674b;
        --accent-weak: #f7ece7;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 10;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 12px 20px;
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }
      header h1 {
        font-size: 17px;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #52c41a;
        box-shadow: 0 0 0 3px rgba(82, 196, 26, 0.18);
      }
      .header-meta {
        color: var(--text-2);
        font-size: 12px;
        min-width: 0;
        flex: 1;
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
      }
      .mono {
        font-family: ui-monospace, 'SF Mono', Consolas, monospace;
      }
      .lang-switch {
        display: inline-flex;
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
      }
      .lang-btn {
        border: none;
        background: var(--surface);
        color: var(--text-2);
        padding: 6px 12px;
        font-size: 12px;
        cursor: pointer;
        transition: all 0.15s;
      }
      .lang-btn + .lang-btn {
        border-left: 1px solid var(--border);
      }
      .lang-btn.active {
        background: var(--accent);
        color: #fff;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 14px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        border-radius: 8px;
        font-size: 13px;
        cursor: pointer;
        transition: all 0.15s;
        white-space: nowrap;
      }
      .btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .btn.primary:hover {
        filter: brightness(1.08);
      }
      main {
        max-width: 1000px;
        margin: 0 auto;
        padding: 20px;
      }
      .crumbs {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
        margin-bottom: 14px;
        flex-wrap: wrap;
      }
      .crumb {
        color: var(--accent);
        cursor: pointer;
        text-decoration: none;
      }
      .crumb:hover {
        text-decoration: underline;
      }
      .sep {
        color: var(--text-2);
      }
      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        text-align: left;
        padding: 11px 16px;
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
      }
      th {
        font-size: 12px;
        color: var(--text-2);
        font-weight: 600;
        background: var(--surface);
      }
      tbody tr:hover {
        background: #faf6f2;
      }
      .name {
        display: flex;
        align-items: center;
        gap: 9px;
        cursor: pointer;
        color: var(--text);
        min-width: 0;
        max-width: 380px;
      }
      .name.file {
        cursor: default;
      }
      .name .nm {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .size,
      .time {
        color: var(--text-2);
        font-size: 13px;
      }
      .act {
        display: flex;
        gap: 8px;
      }
      .act button {
        border: none;
        background: none;
        color: var(--accent);
        cursor: pointer;
        font-size: 13px;
        padding: 2px 4px;
      }
      .act button:hover {
        text-decoration: underline;
      }
      .empty {
        text-align: center;
        color: var(--text-2);
        padding: 48px 0;
      }
      #uploads {
        margin-top: 14px;
        display: none;
        flex-direction: column;
        gap: 8px;
      }
      .up-row {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 14px;
      }
      .up-top {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        margin-bottom: 6px;
        gap: 12px;
      }
      .up-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .up-pct {
        color: var(--text-2);
        white-space: nowrap;
      }
      .bar {
        height: 6px;
        background: var(--border);
        border-radius: 3px;
        overflow: hidden;
      }
      .bar > div {
        height: 100%;
        width: 0;
        background: var(--accent);
        transition: width 0.2s;
      }
      .up-status {
        color: var(--text-2);
      }
      #drop {
        position: fixed;
        inset: 0;
        background: rgba(200, 103, 75, 0.08);
        border: 3px dashed var(--accent);
        display: none;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        color: var(--accent);
        z-index: 100;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 32px;
        transform: translateX(-50%);
        background: #2a2520;
        color: #fff;
        padding: 8px 18px;
        border-radius: 8px;
        font-size: 13px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
        z-index: 200;
      }
    </style>
  </head>
  <body>
    <header>
      <h1><span class="dot"></span><span data-i18n="title">局域快传</span></h1>
      <div class="header-meta">
        <span class="mono" id="addr"></span>
        <span id="rootInfo"></span>
      </div>
      <div class="lang-switch">
        <button id="langZh" class="lang-btn" onclick="setLang('zh')">中文</button>
        <button id="langEn" class="lang-btn" onclick="setLang('en')">EN</button>
      </div>
      <button class="btn" onclick="copyUrl()" data-i18n="copyLink">复制链接</button>
      <button class="btn" onclick="load()" data-i18n="refresh">刷新</button>
    </header>

    <main>
      <div class="crumbs" id="crumbs"></div>

      <div style="margin-bottom: 14px; display: flex; gap: 10px; flex-wrap: wrap">
        <button class="btn primary" onclick="document.getElementById('fileInput').click()" data-i18n="upload">上传文件</button>
        <button class="btn" onclick="newFolder()" data-i18n="newFolder">新建文件夹</button>
      </div>
      <input id="fileInput" type="file" multiple style="display: none" onchange="pickFiles(this.files); this.value=''" />

      <div id="uploads"></div>

      <div class="panel">
        <table>
          <thead>
            <tr>
              <th data-i18n="name">名称</th>
              <th style="width: 110px" data-i18n="size">大小</th>
              <th style="width: 170px" data-i18n="modified">修改时间</th>
              <th style="width: 150px" data-i18n="actions">操作</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
        <div class="empty" id="empty" style="display: none" data-i18n="empty">此文件夹为空</div>
      </div>
    </main>

    <div id="drop" data-i18n="drop">松开上传文件</div>
    <div id="toast"></div>

    <script>
      var I18N = {
        title: { zh: '局域快传', en: 'LAN Transfer' },
        copyLink: { zh: '复制链接', en: 'Copy Link' },
        refresh: { zh: '刷新', en: 'Refresh' },
        upload: { zh: '上传文件', en: 'Upload Files' },
        newFolder: { zh: '新建文件夹', en: 'New Folder' },
        name: { zh: '名称', en: 'Name' },
        size: { zh: '大小', en: 'Size' },
        modified: { zh: '修改时间', en: 'Modified' },
        actions: { zh: '操作', en: 'Actions' },
        empty: { zh: '此文件夹为空', en: 'This folder is empty' },
        drop: { zh: '松开上传文件', en: 'Drop files to upload' },
        root: { zh: '根目录', en: 'Root' },
        free: { zh: '剩余', en: 'Free' },
        copied: { zh: '已复制', en: 'Copied' },
        copyFailed: { zh: '复制失败', en: 'Copy failed' },
        requestFailed: { zh: '请求失败', en: 'Request failed' },
        enterFolderName: { zh: '请输入文件夹名称', en: 'Enter a folder name' },
        created: { zh: '已创建', en: 'Created' },
        done: { zh: '完成', en: 'Done' },
        uploadFailed: { zh: '上传失败', en: 'Upload failed' },
        download: { zh: '下载', en: 'Download' }
      }

      var CHUNK = 1024 * 1024
      var currentPath = ''
      var items = []
      var crumbPaths = []
      var uploads = {}
      var infoCache = null
      var lang = localStorage.getItem('lan-web-lang') === 'en' ? 'en' : 'zh'

      function t(key) {
        return (I18N[key] && I18N[key][lang]) || key
      }

      function esc(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
        })
      }

      function fmtSize(n) {
        if (!n) return '0 B'
        var u = ['B', 'KB', 'MB', 'GB', 'TB']
        var i = Math.floor(Math.log(n) / Math.log(1024))
        if (i >= u.length) i = u.length - 1
        return (n / Math.pow(1024, i)).toFixed(i ? 1 : 0) + ' ' + u[i]
      }

      function fmtTime(ms) {
        if (!ms) return '—'
        var d = new Date(ms)
        function p(x) {
          return x < 10 ? '0' + x : x
        }
        return (
          d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes())
        )
      }

      var toastTimer = null
      function toast(msg) {
        var el = document.getElementById('toast')
        el.textContent = msg
        el.style.opacity = '1'
        clearTimeout(toastTimer)
        toastTimer = setTimeout(function () {
          el.style.opacity = '0'
        }, 1800)
      }

      function copyText(text) {
        function fallback() {
          var ta = document.createElement('textarea')
          ta.value = text
          ta.style.position = 'fixed'
          ta.style.opacity = '0'
          document.body.appendChild(ta)
          ta.select()
          var ok = false
          try {
            ok = document.execCommand('copy')
          } catch (e) {
            ok = false
          }
          document.body.removeChild(ta)
          toast(ok ? t('copied') : t('copyFailed'))
        }
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).then(
            function () {
              toast(t('copied'))
            },
            fallback
          )
        } else {
          fallback()
        }
      }

      function copyUrl() {
        copyText(location.origin + '/')
      }

      function joinPath(a, b) {
        if (!a) return b
        return a.replace(/\/$/, '') + '/' + b
      }

      function deepLink() {
        return location.origin + '/?path=' + encodeURIComponent(currentPath)
      }

      async function apiJson(url, opts) {
        var sep = url.indexOf('?') >= 0 ? '&' : '?'
        url = url + sep + 'lang=' + encodeURIComponent(lang)
        var resp = await fetch(url, opts)
        var j = {}
        try {
          j = await resp.json()
        } catch (e) {}
        if (!resp.ok || j.error) throw new Error(j.error || t('requestFailed'))
        return j
      }

      function renderStatic() {
        document.title = t('title')
        document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN'
        document.querySelectorAll('[data-i18n]').forEach(function (el) {
          el.textContent = t(el.getAttribute('data-i18n'))
        })
        document.getElementById('langZh').classList.toggle('active', lang === 'zh')
        document.getElementById('langEn').classList.toggle('active', lang === 'en')
        document.getElementById('addr').textContent = location.origin + '/'
        if (infoCache) {
          document.getElementById('rootInfo').textContent =
            infoCache.root + ' · ' + t('free') + ' ' + fmtSize(infoCache.free)
        }
        renderCrumbs()
        renderList()
        renderUploads()
      }

      function setLang(next) {
        lang = next === 'en' ? 'en' : 'zh'
        localStorage.setItem('lan-web-lang', lang)
        renderStatic()
      }

      async function load() {
        try {
          var data = await apiJson('/api/list?path=' + encodeURIComponent(currentPath))
          items = data.items || []
          renderCrumbs()
          renderList()
        } catch (e) {
          toast(e.message)
        }
      }

      async function loadInfo() {
        try {
          var info = await apiJson('/api/info')
          infoCache = info
          if (!localStorage.getItem('lan-web-lang') && info.lang === 'en') {
            lang = 'en'
          }
        } catch (e) {
          // keep current language
        }
        renderStatic()
      }

      async function pollFollow() {
        try {
          var info = await apiJson('/api/info')
          infoCache = info
          var infoLang = info.lang === 'en' ? 'en' : 'zh'
          if (!localStorage.getItem('lan-web-lang') && lang !== infoLang) {
            lang = infoLang
            renderStatic()
          } else {
            document.getElementById('rootInfo').textContent =
              info.root + ' · ' + t('free') + ' ' + fmtSize(info.free)
          }
        } catch (e) {
          // ignore polling errors
        }
      }

      function renderCrumbs() {
        var el = document.getElementById('crumbs')
        var parts = currentPath ? currentPath.split('/') : []
        crumbPaths = []
        var acc = ''
        parts.forEach(function (p) {
          acc = acc ? acc + '/' + p : p
          crumbPaths.push(acc)
        })
        var html = '<span class="crumb" onclick="gotoCrumb(-1)">' + esc(t('root')) + '</span>'
        parts.forEach(function (p, i) {
          html += '<span class="sep">/</span><span class="crumb" onclick="gotoCrumb(' + i + ')">' + esc(p) + '</span>'
        })
        el.innerHTML = html
      }

      function gotoCrumb(i) {
        currentPath = i === -1 ? '' : crumbPaths[i]
        load()
        history.replaceState(null, '', deepLink())
      }

      function goDir(i) {
        currentPath = joinPath(currentPath, items[i].name)
        load()
        history.replaceState(null, '', deepLink())
      }

      function renderList() {
        var tbody = document.getElementById('tbody')
        var empty = document.getElementById('empty')
        if (!items.length) {
          tbody.innerHTML = ''
          empty.style.display = 'block'
          return
        }
        empty.style.display = 'none'
        tbody.innerHTML = items
          .map(function (it, i) {
            var nameCell = it.isDir
              ? '<div class="name" onclick="goDir(' + i + ')"><span>📁</span><span class="nm">' + esc(it.name) + '</span></div>'
              : '<div class="name file"><span>📄</span><span class="nm">' + esc(it.name) + '</span></div>'
            var acts = it.isDir
              ? '<button onclick="copyDirLink(' + i + ')">' + esc(t('copyLink')) + '</button>'
              : '<button onclick="download(' + i + ')">' + esc(t('download')) + '</button>' +
                '<button onclick="copyFileLink(' + i + ')">' + esc(t('copyLink')) + '</button>'
            return (
              '<tr>' +
              '<td>' + nameCell + '</td>' +
              '<td class="size">' + (it.isDir ? '—' : fmtSize(it.size)) + '</td>' +
              '<td class="time">' + fmtTime(it.mtime) + '</td>' +
              '<td class="act">' + acts + '</td>' +
              '</tr>'
            )
          })
          .join('')
      }

      function download(i) {
        var it = items[i]
        location.href = '/api/download?path=' + encodeURIComponent(joinPath(currentPath, it.name))
      }

      function copyFileLink(i) {
        copyText(location.origin + '/api/download?path=' + encodeURIComponent(joinPath(currentPath, items[i].name)))
      }

      function copyDirLink(i) {
        copyText(location.origin + '/?path=' + encodeURIComponent(joinPath(currentPath, items[i].name)))
      }

      async function newFolder() {
        var name = prompt(t('enterFolderName'))
        if (!name) return
        try {
          await apiJson('/api/mkdir?path=' + encodeURIComponent(joinPath(currentPath, name)), { method: 'POST' })
          toast(t('created'))
          load()
        } catch (e) {
          toast(e.message)
        }
      }

      function addUploadRow(name, size) {
        var id = 'up' + Math.random().toString(36).slice(2)
        uploads[id] = { name: name, size: size, sent: 0, done: false, error: false }
        renderUploads()
        return id
      }

      function setUploadProgress(id, sent, size) {
        var u = uploads[id]
        if (!u) return
        u.sent = sent
        renderUploads()
      }

      function setUploadDone(id) {
        var u = uploads[id]
        if (u) u.done = true
        renderUploads()
        setTimeout(function () {
          delete uploads[id]
          renderUploads()
        }, 1500)
        load()
      }

      function setUploadError(id, msg) {
        var u = uploads[id]
        if (u) {
          u.error = true
          u.msg = msg
        }
        renderUploads()
      }

      function renderUploads() {
        var el = document.getElementById('uploads')
        var keys = Object.keys(uploads)
        if (!keys.length) {
          el.style.display = 'none'
          return
        }
        el.style.display = 'flex'
        el.innerHTML = keys
          .map(function (k) {
            var u = uploads[k]
            var pct = u.size ? Math.min(100, Math.round((u.sent / u.size) * 100)) : 100
            var status = u.error ? u.msg : u.done ? t('done') : pct + '%'
            return (
              '<div class="up-row"><div class="up-top">' +
              '<span class="up-name">' + esc(u.name) + '</span>' +
              '<span class="up-pct ' + (u.error ? 'up-status' : '') + '">' + esc(status) + '</span>' +
              '</div><div class="bar"><div style="width:' + pct + '%"></div></div></div>'
            )
          })
          .join('')
      }

      async function uploadOne(file) {
        var total = Math.max(1, Math.ceil(file.size / CHUNK))
        var session = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)).replace(/-/g, '')
        var id = addUploadRow(file.name, file.size)
        try {
          var sent = 0
          for (var i = 0; i < total; i++) {
            var start = i * CHUNK
            var blob = file.slice(start, Math.min(start + CHUNK, file.size))
            var qs = new URLSearchParams({
              dir: currentPath,
              name: file.name,
              session: session,
              index: String(i),
              total: String(total)
            })
            var j = await apiJson('/api/upload?' + qs.toString(), { method: 'POST', body: blob })
            if (!j.ok) throw new Error(t('uploadFailed'))
            sent += blob.size
            setUploadProgress(id, sent, file.size)
          }
          setUploadDone(id)
        } catch (e) {
          setUploadError(id, e.message)
        }
      }

      async function uploadFiles(files) {
        var list = Array.prototype.slice.call(files)
        if (!list.length) return
        var workers = Math.min(3, list.length)
        var idx = 0
        var tasks = []
        async function next() {
          while (idx < list.length) {
            var f = list[idx++]
            await uploadOne(f)
          }
        }
        for (var w = 0; w < workers; w++) tasks.push(next())
        await Promise.all(tasks)
      }

      function pickFiles(files) {
        uploadFiles(files)
      }

      var dragDepth = 0
      var drop = document.getElementById('drop')
      window.addEventListener('dragenter', function (e) {
        e.preventDefault()
        dragDepth++
        drop.style.display = 'flex'
      })
      window.addEventListener('dragover', function (e) {
        e.preventDefault()
      })
      window.addEventListener('dragleave', function (e) {
        e.preventDefault()
        dragDepth--
        if (dragDepth <= 0) {
          dragDepth = 0
          drop.style.display = 'none'
        }
      })
      window.addEventListener('drop', function (e) {
        e.preventDefault()
        dragDepth = 0
        drop.style.display = 'none'
        if (e.dataTransfer && e.dataTransfer.files.length) {
          uploadFiles(e.dataTransfer.files)
        }
      })

      var sp = new URLSearchParams(location.search)
      var initPath = sp.get('path')
      currentPath = initPath ? initPath.replace(/^\/+/, '') : ''
      loadInfo()
      load()
      setInterval(pollFollow, 3000)
    </script>
  </body>
</html>
