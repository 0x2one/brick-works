<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>局域快传</title>
    <style>
      :root {
        --bg: #f3f0eb;
        --surface: #fff;
        --border: #e5ddd4;
        --text: #2a2520;
        --text-2: #8a7e72;
        --accent: #c8674b;
        --accent-weak: #f7ece7;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 10;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 12px 20px;
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }
      header h1 {
        font-size: 17px;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #52c41a;
        box-shadow: 0 0 0 3px rgba(82, 196, 26, 0.18);
      }
      .header-meta {
        color: var(--text-2);
        font-size: 12px;
        min-width: 0;
        flex: 1;
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
      }
      .mono {
        font-family: ui-monospace, 'SF Mono', Consolas, monospace;
      }
      .lang-switch {
        display: inline-flex;
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
      }
      .lang-btn {
        border: none;
        background: var(--surface);
        color: var(--text-2);
        padding: 6px 12px;
        font-size: 12px;
        cursor: pointer;
        transition: all 0.15s;
      }
      .lang-btn + .lang-btn {
        border-left: 1px solid var(--border);
      }
      .lang-btn.active {
        background: var(--accent);
        color: #fff;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 14px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        border-radius: 8px;
        font-size: 13px;
        cursor: pointer;
        transition: all 0.15s;
        white-space: nowrap;
      }
      .btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .btn.primary:hover {
        filter: brightness(1.08);
      }
      main {
        max-width: 1000px;
        margin: 0 auto;
        padding: 20px;
      }
      .crumbs {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
        margin-bottom: 14px;
        flex-wrap: wrap;
      }
      .crumb {
        color: var(--accent);
        cursor: pointer;
        text-decoration: none;
      }
      .crumb:hover {
        text-decoration: underline;
      }
      .sep {
        color: var(--text-2);
      }
      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
      }
      .list-head,
      .list-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 110px 170px 150px;
        align-items: center;
      }
      .list-head {
        padding: 11px 16px;
        font-size: 12px;
        color: var(--text-2);
        font-weight: 600;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
      }
      .list-row {
        padding: 11px 16px;
        border-bottom: 1px solid var(--border);
        min-width: 0;
      }
      .list-row:hover {
        background: #faf6f2;
      }
      .col-name,
      .col-size,
      .col-time,
      .col-act {
        min-width: 0;
      }
      .name {
        display: flex;
        align-items: center;
        gap: 9px;
        cursor: pointer;
        color: var(--text);
        min-width: 0;
        max-width: 380px;
      }
      .name.file {
        cursor: default;
      }
      .name .nm {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .size,
      .time {
        color: var(--text-2);
        font-size: 13px;
      }
      .act {
        display: flex;
        gap: 8px;
      }
      .act button {
        border: none;
        background: none;
        color: var(--accent);
        cursor: pointer;
        font-size: 13px;
        padding: 2px 4px;
      }
      .act button:hover {
        text-decoration: underline;
      }
      .empty {
        text-align: center;
        color: var(--text-2);
        padding: 48px 0;
      }
      #uploads {
        margin-top: 14px;
        display: none;
        flex-direction: column;
        gap: 8px;
      }
      .up-row {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 14px;
      }
      .up-top {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        margin-bottom: 6px;
        gap: 12px;
      }
      .up-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .up-pct {
        color: var(--text-2);
        white-space: nowrap;
      }
      .bar {
        height: 6px;
        background: var(--border);
        border-radius: 3px;
        overflow: hidden;
      }
      .bar > div {
        height: 100%;
        width: 0;
        background: var(--accent);
        transition: width 0.2s;
      }
      .up-status {
        color: var(--text-2);
      }
      #drop {
        position: fixed;
        inset: 0;
        background: rgba(200, 103, 75, 0.08);
        border: 3px dashed var(--accent);
        display: none;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        color: var(--accent);
        z-index: 100;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 32px;
        transform: translateX(-50%);
        background: #2a2520;
        color: #fff;
        padding: 8px 18px;
        border-radius: 8px;
        font-size: 13px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
        z-index: 200;
      }
      #authGate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 300;
        background: var(--bg);
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      #authGate.show {
        display: flex;
      }
      .auth-card {
        width: 100%;
        max-width: 360px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 24px;
      }
      .auth-card h2 {
        margin: 0 0 8px;
        font-size: 18px;
      }
      .auth-card p {
        margin: 0 0 16px;
        color: var(--text-2);
        font-size: 13px;
      }
      .auth-card input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 14px;
        margin-bottom: 12px;
        outline: none;
      }
      .auth-card input:focus {
        border-color: var(--accent);
      }
      #appRoot.hidden {
        display: none;
      }
      .toolbar {
        margin-bottom: 14px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      @media (max-width: 640px) {
        .toolbar .btn {
          flex: 1 1 130px;
          min-height: 42px;
          justify-content: center;
          font-size: 14px;
        }
        .list-head,
        .list-row {
          grid-template-columns: minmax(0, 1fr) 72px auto;
        }
        .col-time {
          display: none;
        }
        .act {
          gap: 12px;
        }
        .act button {
          font-size: 14px;
          padding: 4px 6px;
        }
        .name {
          max-width: none;
        }
        main {
          padding: 12px;
        }
        header {
          padding: 10px 12px;
        }
        .header-meta {
          flex-basis: 100%;
          order: 10;
        }
        .lang-btn {
          padding: 8px 14px;
        }
        .btn {
          white-space: normal;
        }
      }
    </style>
  </head>
  <body>
    <div id="authGate">
      <div class="auth-card">
        <h2 data-i18n="authTitle">输入访问口令</h2>
        <p data-i18n="authHint">请在 BrickWorks 应用中查看一次性口令后填入。</p>
        <input id="tokenInput" type="password" autocomplete="off" />
        <button
          class="btn primary"
          style="width: 100%"
          onclick="submitToken()"
          data-i18n="authSubmit"
        >
          进入
        </button>
      </div>
    </div>

    <div id="appRoot">
      <header>
        <h1><span class="dot"></span><span data-i18n="title">局域快传</span></h1>
        <div class="header-meta">
          <span class="mono" id="addr"></span>
          <span id="rootInfo"></span>
        </div>
        <div class="lang-switch">
          <button id="langZh" class="lang-btn" onclick="setLang('zh')">中文</button>
          <button id="langEn" class="lang-btn" onclick="setLang('en')">EN</button>
        </div>
        <button class="btn" onclick="copyUrl()" data-i18n="copyLink">复制链接</button>
        <button class="btn" onclick="load()" data-i18n="refresh">刷新</button>
      </header>

      <main>
        <div class="crumbs" id="crumbs"></div>

        <div class="toolbar">
          <button
            class="btn primary"
            onclick="document.getElementById('fileInput').click()"
            data-i18n="upload"
          >
            上传文件
          </button>
          <button class="btn" onclick="newFolder()" data-i18n="newFolder">新建文件夹</button>
        </div>
        <input
          id="fileInput"
          type="file"
          multiple
          style="display: none"
          onchange="
            pickFiles(this.files)
            this.value = ''
          "
        />

        <div id="uploads"></div>

        <div class="panel">
          <div class="list-head">
            <div data-i18n="name">名称</div>
            <div data-i18n="size">大小</div>
            <div data-i18n="modified" class="col-time">修改时间</div>
            <div data-i18n="actions">操作</div>
          </div>
          <div id="tbody"></div>
          <div class="empty" id="empty" style="display: none" data-i18n="empty">此文件夹为空</div>
        </div>
      </main>
    </div>

    <div id="drop" data-i18n="drop">松开上传文件</div>
    <div id="toast"></div>

    <script>
      var I18N = {
        title: { zh: '局域快传', en: 'LAN Transfer' },
        copyLink: { zh: '复制链接', en: 'Copy Link' },
        refresh: { zh: '刷新', en: 'Refresh' },
        upload: { zh: '上传文件', en: 'Upload Files' },
        newFolder: { zh: '新建文件夹', en: 'New Folder' },
        name: { zh: '名称', en: 'Name' },
        size: { zh: '大小', en: 'Size' },
        modified: { zh: '修改时间', en: 'Modified' },
        actions: { zh: '操作', en: 'Actions' },
        empty: { zh: '此文件夹为空', en: 'This folder is empty' },
        drop: { zh: '松开上传文件', en: 'Drop files to upload' },
        root: { zh: '根目录', en: 'Root' },
        free: { zh: '剩余', en: 'Free' },
        copied: { zh: '已复制', en: 'Copied' },
        copyFailed: { zh: '复制失败', en: 'Copy failed' },
        requestFailed: { zh: '请求失败', en: 'Request failed' },
        enterFolderName: { zh: '请输入文件夹名称', en: 'Enter a folder name' },
        created: { zh: '已创建', en: 'Created' },
        done: { zh: '完成', en: 'Done' },
        uploadFailed: { zh: '上传失败', en: 'Upload failed' },
        download: { zh: '下载', en: 'Download' },
        authTitle: { zh: '输入访问口令', en: 'Enter Access Token' },
        authHint: {
          zh: '请在 BrickWorks 应用中查看一次性口令后填入。',
          en: 'Enter the one-time token shown in the BrickWorks app.'
        },
        authSubmit: { zh: '进入', en: 'Enter' },
        authInvalid: { zh: '口令无效', en: 'Invalid token' }
      }

      var CHUNK = 1024 * 1024
      var TOKEN_KEY = 'lan-web-token'
      var currentPath = ''
      var items = []
      var crumbPaths = []
      var uploads = {}
      var infoCache = null
      var lang = localStorage.getItem('lan-web-lang') === 'en' ? 'en' : 'zh'
      var accessToken = sessionStorage.getItem(TOKEN_KEY) || ''

      function t(key) {
        return (I18N[key] && I18N[key][lang]) || key
      }

      function esc(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
        })
      }

      function fmtSize(n) {
        if (!n) return '0 B'
        var u = ['B', 'KB', 'MB', 'GB', 'TB']
        var i = Math.floor(Math.log(n) / Math.log(1024))
        if (i >= u.length) i = u.length - 1
        return (n / Math.pow(1024, i)).toFixed(i ? 1 : 0) + ' ' + u[i]
      }

      function fmtTime(ms) {
        if (!ms) return '—'
        var d = new Date(ms)
        function p(x) {
          return x < 10 ? '0' + x : x
        }
        return (
          d.getFullYear() +
          '-' +
          p(d.getMonth() + 1) +
          '-' +
          p(d.getDate()) +
          ' ' +
          p(d.getHours()) +
          ':' +
          p(d.getMinutes())
        )
      }

      var toastTimer = null
      function toast(msg) {
        var el = document.getElementById('toast')
        el.textContent = msg
        el.style.opacity = '1'
        clearTimeout(toastTimer)
        toastTimer = setTimeout(function () {
          el.style.opacity = '0'
        }, 1800)
      }

      function copyText(text) {
        function fallback() {
          var ta = document.createElement('textarea')
          ta.value = text
          ta.style.position = 'fixed'
          ta.style.opacity = '0'
          document.body.appendChild(ta)
          ta.select()
          var ok = false
          try {
            ok = document.execCommand('copy')
          } catch (e) {
            ok = false
          }
          document.body.removeChild(ta)
          toast(ok ? t('copied') : t('copyFailed'))
        }
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).then(function () {
            toast(t('copied'))
          }, fallback)
        } else {
          fallback()
        }
      }

      function withToken(url) {
        var sep = url.indexOf('?') >= 0 ? '&' : '?'
        var next = url + sep + 'lang=' + encodeURIComponent(lang)
        if (accessToken) next += '&token=' + encodeURIComponent(accessToken)
        return next
      }

      function copyUrl() {
        copyText(location.origin + '/?token=' + encodeURIComponent(accessToken))
      }

      function joinPath(a, b) {
        if (!a) return b
        return a.replace(/\/$/, '') + '/' + b
      }

      function deepLink() {
        var q = 'token=' + encodeURIComponent(accessToken)
        if (currentPath) q += '&path=' + encodeURIComponent(currentPath)
        return location.origin + '/?' + q
      }

      function showAuthGate(show) {
        document.getElementById('authGate').classList.toggle('show', show)
        document.getElementById('appRoot').classList.toggle('hidden', show)
      }

      function setAccessToken(token) {
        accessToken = (token || '').trim()
        if (accessToken) sessionStorage.setItem(TOKEN_KEY, accessToken)
        else sessionStorage.removeItem(TOKEN_KEY)
      }

      async function submitToken() {
        var input = document.getElementById('tokenInput')
        setAccessToken(input.value)
        try {
          await apiJson('/api/info')
          showAuthGate(false)
          history.replaceState(null, '', deepLink())
          await bootApp()
        } catch (e) {
          setAccessToken('')
          toast(t('authInvalid'))
        }
      }

      async function apiJson(url, opts) {
        opts = opts || {}
        opts.headers = opts.headers || {}
        if (accessToken) opts.headers['X-Lan-Token'] = accessToken
        var resp = await fetch(withToken(url), opts)
        var j = {}
        try {
          j = await resp.json()
        } catch (e) {}
        if (resp.status === 401 || j.code === 'AUTH_REQUIRED') {
          showAuthGate(true)
          throw new Error(j.error || t('authInvalid'))
        }
        if (!resp.ok || j.error) throw new Error(j.error || t('requestFailed'))
        return j
      }

      function renderStatic() {
        document.title = t('title')
        document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN'
        document.querySelectorAll('[data-i18n]').forEach(function (el) {
          el.textContent = t(el.getAttribute('data-i18n'))
        })
        document.getElementById('langZh').classList.toggle('active', lang === 'zh')
        document.getElementById('langEn').classList.toggle('active', lang === 'en')
        document.getElementById('addr').textContent = location.origin + '/'
        if (infoCache) {
          document.getElementById('rootInfo').textContent =
            infoCache.root + ' · ' + t('free') + ' ' + fmtSize(infoCache.free)
        }
        renderCrumbs()
        renderList()
        renderUploads()
      }

      function setLang(next) {
        lang = next === 'en' ? 'en' : 'zh'
        localStorage.setItem('lan-web-lang', lang)
        renderStatic()
      }

      async function load() {
        try {
          var data = await apiJson('/api/list?path=' + encodeURIComponent(currentPath))
          items = data.items || []
          renderCrumbs()
          renderList()
        } catch (e) {
          toast(e.message)
        }
      }

      async function loadInfo() {
        try {
          var info = await apiJson('/api/info')
          infoCache = info
          if (!localStorage.getItem('lan-web-lang') && info.lang === 'en') {
            lang = 'en'
          }
        } catch (e) {
          // keep current language
        }
        renderStatic()
      }

      async function pollFollow() {
        try {
          var info = await apiJson('/api/info')
          infoCache = info
          var infoLang = info.lang === 'en' ? 'en' : 'zh'
          if (!localStorage.getItem('lan-web-lang') && lang !== infoLang) {
            lang = infoLang
            renderStatic()
          } else {
            document.getElementById('rootInfo').textContent =
              info.root + ' · ' + t('free') + ' ' + fmtSize(info.free)
          }
        } catch (e) {
          // ignore polling errors
        }
      }

      function renderCrumbs() {
        var el = document.getElementById('crumbs')
        var parts = currentPath ? currentPath.split('/') : []
        crumbPaths = []
        var acc = ''
        parts.forEach(function (p) {
          acc = acc ? acc + '/' + p : p
          crumbPaths.push(acc)
        })
        var html = '<span class="crumb" onclick="gotoCrumb(-1)">' + esc(t('root')) + '</span>'
        parts.forEach(function (p, i) {
          html +=
            '<span class="sep">/</span><span class="crumb" onclick="gotoCrumb(' +
            i +
            ')">' +
            esc(p) +
            '</span>'
        })
        el.innerHTML = html
      }

      function gotoCrumb(i) {
        currentPath = i === -1 ? '' : crumbPaths[i]
        load()
        history.replaceState(null, '', deepLink())
      }

      function goDir(i) {
        currentPath = joinPath(currentPath, items[i].name)
        load()
        history.replaceState(null, '', deepLink())
      }

      function renderList() {
        var tbody = document.getElementById('tbody')
        var empty = document.getElementById('empty')
        if (!items.length) {
          tbody.innerHTML = ''
          empty.style.display = 'block'
          return
        }
        empty.style.display = 'none'
        tbody.innerHTML = items
          .map(function (it, i) {
            var nameCell = it.isDir
              ? '<div class="name" onclick="goDir(' +
                i +
                ')"><span>📁</span><span class="nm">' +
                esc(it.name) +
                '</span></div>'
              : '<div class="name file"><span>📄</span><span class="nm">' +
                esc(it.name) +
                '</span></div>'
            var acts = it.isDir
              ? '<button onclick="copyDirLink(' + i + ')">' + esc(t('copyLink')) + '</button>'
              : '<button onclick="download(' +
                i +
                ')">' +
                esc(t('download')) +
                '</button>' +
                '<button onclick="copyFileLink(' +
                i +
                ')">' +
                esc(t('copyLink')) +
                '</button>'
            return (
              '<div class="list-row">' +
              '<div class="col-name">' +
              nameCell +
              '</div>' +
              '<div class="col-size size">' +
              (it.isDir ? '—' : fmtSize(it.size)) +
              '</div>' +
              '<div class="col-time time">' +
              fmtTime(it.mtime) +
              '</div>' +
              '<div class="col-act act">' +
              acts +
              '</div>' +
              '</div>'
            )
          })
          .join('')
      }

      function download(i) {
        var it = items[i]
        location.href = withToken(
          '/api/download?path=' + encodeURIComponent(joinPath(currentPath, it.name))
        )
      }

      function copyFileLink(i) {
        copyText(
          withToken(
            location.origin +
              '/api/download?path=' +
              encodeURIComponent(joinPath(currentPath, items[i].name))
          )
        )
      }

      function copyDirLink(i) {
        var q =
          'token=' +
          encodeURIComponent(accessToken) +
          '&path=' +
          encodeURIComponent(joinPath(currentPath, items[i].name))
        copyText(location.origin + '/?' + q)
      }

      async function newFolder() {
        var name = prompt(t('enterFolderName'))
        if (!name) return
        try {
          await apiJson('/api/mkdir?path=' + encodeURIComponent(joinPath(currentPath, name)), {
            method: 'POST'
          })
          toast(t('created'))
          load()
        } catch (e) {
          toast(e.message)
        }
      }

      function addUploadRow(name, size) {
        var id = 'up' + Math.random().toString(36).slice(2)
        uploads[id] = { name: name, size: size, sent: 0, done: false, error: false }
        renderUploads()
        return id
      }

      function setUploadProgress(id, sent, size) {
        var u = uploads[id]
        if (!u) return
        u.sent = sent
        renderUploads()
      }

      function setUploadDone(id) {
        var u = uploads[id]
        if (u) u.done = true
        renderUploads()
        setTimeout(function () {
          delete uploads[id]
          renderUploads()
        }, 1500)
        load()
      }

      function setUploadError(id, msg) {
        var u = uploads[id]
        if (u) {
          u.error = true
          u.msg = msg
        }
        renderUploads()
      }

      function renderUploads() {
        var el = document.getElementById('uploads')
        var keys = Object.keys(uploads)
        if (!keys.length) {
          el.style.display = 'none'
          return
        }
        el.style.display = 'flex'
        el.innerHTML = keys
          .map(function (k) {
            var u = uploads[k]
            var pct = u.size ? Math.min(100, Math.round((u.sent / u.size) * 100)) : 100
            var status = u.error ? u.msg : u.done ? t('done') : pct + '%'
            return (
              '<div class="up-row"><div class="up-top">' +
              '<span class="up-name">' +
              esc(u.name) +
              '</span>' +
              '<span class="up-pct ' +
              (u.error ? 'up-status' : '') +
              '">' +
              esc(status) +
              '</span>' +
              '</div><div class="bar"><div style="width:' +
              pct +
              '%"></div></div></div>'
            )
          })
          .join('')
      }

      async function uploadOne(file) {
        var total = Math.max(1, Math.ceil(file.size / CHUNK))
        var session = (
          crypto.randomUUID
            ? crypto.randomUUID()
            : String(Date.now()) + Math.random().toString(16).slice(2)
        ).replace(/-/g, '')
        var id = addUploadRow(file.name, file.size)
        try {
          var sent = 0
          for (var i = 0; i < total; i++) {
            var start = i * CHUNK
            var blob = file.slice(start, Math.min(start + CHUNK, file.size))
            var qs = new URLSearchParams({
              dir: currentPath,
              name: file.name,
              session: session,
              index: String(i),
              total: String(total)
            })
            var j = await apiJson('/api/upload?' + qs.toString(), { method: 'POST', body: blob })
            if (!j.ok) throw new Error(t('uploadFailed'))
            sent += blob.size
            setUploadProgress(id, sent, file.size)
          }
          setUploadDone(id)
        } catch (e) {
          setUploadError(id, e.message)
        }
      }

      async function uploadFiles(files) {
        var list = Array.prototype.slice.call(files)
        if (!list.length) return
        var workers = Math.min(3, list.length)
        var idx = 0
        var tasks = []
        async function next() {
          while (idx < list.length) {
            var f = list[idx++]
            await uploadOne(f)
          }
        }
        for (var w = 0; w < workers; w++) tasks.push(next())
        await Promise.all(tasks)
      }

      function pickFiles(files) {
        uploadFiles(files)
      }

      var dragDepth = 0
      var drop = document.getElementById('drop')
      window.addEventListener('dragenter', function (e) {
        e.preventDefault()
        dragDepth++
        drop.style.display = 'flex'
      })
      window.addEventListener('dragover', function (e) {
        e.preventDefault()
      })
      window.addEventListener('dragleave', function (e) {
        e.preventDefault()
        dragDepth--
        if (dragDepth <= 0) {
          dragDepth = 0
          drop.style.display = 'none'
        }
      })
      window.addEventListener('drop', function (e) {
        e.preventDefault()
        dragDepth = 0
        drop.style.display = 'none'
        if (e.dataTransfer && e.dataTransfer.files.length) {
          uploadFiles(e.dataTransfer.files)
        }
      })

      async function bootApp() {
        await loadInfo()
        await load()
      }

      var sp = new URLSearchParams(location.search)
      var initPath = sp.get('path')
      currentPath = initPath ? initPath.replace(/^\/+/, '') : ''
      var urlToken = sp.get('token')
      if (urlToken) setAccessToken(urlToken)
      if (!accessToken) {
        showAuthGate(true)
        renderStatic()
      } else {
        showAuthGate(false)
        bootApp().catch(function () {
          showAuthGate(true)
        })
      }
      setInterval(function () {
        if (accessToken && !document.getElementById('authGate').classList.contains('show')) {
          pollFollow()
        }
      }, 3000)
    </script>
  </body>
</html>
